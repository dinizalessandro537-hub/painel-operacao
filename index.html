<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WT T1 - Painel de Operações</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        aside {
            width: 240px;
            background-color: #1e1e1e;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        aside h2 {
            font-size: 18px;
            color: #ffe600;
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu-link {
            display: block;
            color: #bbb;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 8px;
            transition: 0.2s;
            font-weight: 500;
        }
        .menu-link:hover, .menu-link.active {
            background-color: #ffe600;
            color: #121212;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #181818;
            overflow-y: auto;
        }
        header {
            background-color: #1e1e1e;
            padding: 15px 30px;
            border-bottom: 1px solid #333;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
        }
        .content {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }
        .panel-card {
            background: #212121;
            width: 100%;
            max-width: 650px;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            border: 1px solid #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #ffe600;
            margin-bottom: 8px;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #121212;
            border: 2px solid #444;
            border-radius: 6px;
            color: #fff;
            padding: 12px;
            font-size: 16px;
            resize: none;
            outline: none;
            transition: 0.2s;
        }
        textarea:focus {
            border-color: #ffe600;
        }
        .corredores-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .corredor-opcao {
            background-color: #121212;
            border: 2px solid #444;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            color: #fff;
        }
        .corredor-opcao:hover {
            border-color: #777;
        }
        .corredor-opcao input {
            accent-color: #ffe600;
            transform: scale(1.1);
        }
        .corredor-opcao.selected {
            border-color: #ffe600;
            background-color: rgba(255, 230, 0, 0.08);
        }
        .btn-enviar {
            width: 100%;
            background-color: #ffe600;
            color: #121212;
            border: none;
            padding: 14px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-enviar:hover {
            background-color: #e6cf00;
        }
        #mensagem-sucesso {
            display: none;
            margin-top: 15px;
            padding: 12px;
            background-color: rgba(40, 167, 69, 0.2);
            border: 1px solid #28a745;
            color: #28a745;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
                overflow: auto;
            }
            aside {
                width: 100%;
                padding: 10px 15px;
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
            aside h2 {
                margin-bottom: 0;
                font-size: 15px;
            }
            .menu-link {
                display: inline-block;
                margin-bottom: 0;
                padding: 8px 12px;
                font-size: 13px;
            }
            .content {
                padding: 10px;
            }
            .corredores-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <aside>
        <h2>⚡ WT T1</h2>
        <a href="#" class="menu-link active">📦 Registrar Perdas</a>
    </aside>

    <main>
        <header>Painel de Operações - Perdas Packing T1</header>
        <div class="content">
            
            <div class="panel-card">
                <form id="form-perdas" onsubmit="enviarDados(event)">
                    
                    <div class="form-group">
                        <label>🔴 Digite ou Bipe a MELI ou EAN:</label>
                        <textarea id="campo-bip" placeholder="Bipe os códigos aqui. Serão separados automaticamente..." required></textarea>
                    </div>

                    <div class="form-group">
                        <label>📍 QUAL CORREDOR:</label>
                        <div class="corredores-grid">
                            <label class="corredor-opcao"><input type="radio" name="corredor" value="CORREDOR 1 (MACHINE)" required> CORREDOR 1 (MACHINE)</label>
                            <label class="corredor-opcao"><input type="radio" name="corredor" value="CORREDOR 2"> CORREDOR 2</label>
                            <label class="corredor-opcao"><input type="radio" name="corredor" value="CORREDOR 3"> CORREDOR 3</label>
                            <label class="corredor-opcao"><input type="radio" name="corredor" value="CORREDOR 4"> CORREDOR 4</label>
                            <label class="corredor-opcao"><input type="radio" name="corredor" value="CORREDOR 5 (ULTIMO)"> CORREDOR 5 (ULTIMO)</label>
                            <label class="corredor-opcao"><input type="radio" name="corredor" value="REJEITO"> REJEITO</label>
                        </div>
                    </div>

                    <button type="submit" class="btn-enviar" id="btn-texto">Registrar Perdas</button>
                    
                    <div id="mensagem-sucesso">✅ Perdas registradas com sucesso!</div>
                </form>
            </div>

        </div>
    </main>

    <script>
        const textarea = document.getElementById('campo-bip');

        // Quebra automática universal para qualquer código colado ou rajada de bip
        textarea.addEventListener('input', function() {
            let texto = this.value;
            
            // Remove espaços extras indesejados e quebra qualquer bloco grudado de 9 a 14 caracteres (padrão MELI/EAN)
            let textoFormatado = texto
                .replace(/\s+/g, '\n') // Substitui espaços vazios por quebra de linha
                .replace(/([A-Z0-9]{9,14})(?=[A-Z0-9])/g, '$1\n'); // Força quebra entre blocos colados de etiquetas

            if (texto !== textoFormatado) {
                this.value = textoFormatado;
            }
        });

        document.querySelectorAll('.corredor-opcao').forEach(label => {
            label.addEventListener('click', function() {
                document.querySelectorAll('.corredor-opcao').forEach(l => l.classList.remove('selected'));
                this.classList.add('selected');
                this.querySelector('input').checked = true;
            });
        });

        function enviarDados(event) {
            event.preventDefault();
            
            let codigos = document.getElementById('campo-bip').value;
            let corredorSelect = document.querySelector('input[name="corredor"]:checked');
            
            if (!corredorSelect) {
                alert('Por favor, selecione um corredor.');
                return;
            }

            let corredor = corredorSelect.value;
            let btn = document.getElementById('btn-texto');
            let sucessoBox = document.getElementById('mensagem-sucesso');

            btn.innerText = "Enviando...";
            btn.disabled = true;

            let formUrl = "https://docs.google.com/forms/u/0/d/e/1FAIpQLSdNOrORFRdaxFgruRX61VjgvxJo7WX9vmOBLQI_NsaERdH1Ww/viewform?embedded=true".replace('/viewform?embedded=true', '/formResponse');
            
            let formData = new FormData();
            formData.append("entry.SEU_CAMPO_TEXTO", codigos); 
            formData.append("entry.SEU_CAMPO_CORREDOR", corredor);

            fetch(formUrl, {
                method: "POST",
                mode: "no-cors",
                body: formData
            }).then(() => {
                sucessoBox.style.display = "block";
                document.getElementById('form-perdas').reset();
                document.querySelectorAll('.corredor-opcao').forEach(l => l.classList.remove('selected'));
                btn.innerText = "Registrar Perdas";
                btn.disabled = false;

                setTimeout(() => { sucessoBox.style.display = "none"; }, 4000);
            }).catch(() => {
                sucessoBox.style.display = "block";
                document.getElementById('form-perdas').reset();
                btn.innerText = "Registrar Perdas";
                btn.disabled = false;
                setTimeout(() => { sucessoBox.style.display = "none"; }, 4000);
            });
        }
    </script>
</body>
</html>
